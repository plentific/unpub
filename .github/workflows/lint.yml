name: lint
on:
  - push
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dart:3.12.2
    steps:
      - uses: actions/checkout@v4
      - run: cd unpub && dart pub get --enforce-lockfile && dart analyze && dart test --exclude-tags mongodb
      - run: cd unpub_aws && dart pub get && dart analyze && dart test
      - run: dart format --set-exit-if-changed unpub unpub_aws
